name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.3.0 or 0.3.0-rc.1)'
        required: true
        type: string
      skip_release:
        description: 'Only build binaries, skip GitHub Release and Homebrew update'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS binaries
    runs-on: macos-14
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.15.7'
          otp-version: '26.1'

      - name: Install dependencies
        run: mix deps.get

      - name: Prepare output directory
        run: mkdir -p release_out

      - name: Build macOS ARM binary
        run: |
          mix release --overwrite
          cp burrito_out/magma_macos_arm release_out/
        env:
          BURRITO_TARGET: macos_arm

      - name: Build macOS Intel binary
        run: |
          mix release --overwrite
          cp burrito_out/magma_macos_intel release_out/
        env:
          BURRITO_TARGET: macos_intel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: release_out/

  build-linux:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.15.7'
          otp-version: '26.1'

      - name: Install dependencies
        run: mix deps.get

      - name: Prepare output directory
        run: mkdir -p release_out

      - name: Build Linux Intel binary
        run: |
          mix release --overwrite
          cp burrito_out/magma_linux_intel release_out/
        env:
          BURRITO_TARGET: linux_intel

      - name: Build Linux ARM binary
        run: |
          mix release --overwrite
          cp burrito_out/magma_linux_arm release_out/
        env:
          BURRITO_TARGET: linux_arm

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: release_out/

  release:
    name: Create GitHub Release
    needs: [build-macos, build-linux]
    if: ${{ !(inputs.skip_release || false) }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version info
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp artifacts/macos-binaries/* release/
          cp artifacts/linux-binaries/* release/
          chmod +x release/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    name: Update Homebrew Tap
    needs: [release]
    if: needs.release.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Homebrew formula
        run: .github/scripts/update_tap.sh
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
